name: CI

on:
  push:
    branches: [development, main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # O wheel do opencv-python (não-headless) linka libGL; sem isso o
      # `import cv2` falha no runner. O nome do libglib mudou no Ubuntu 24.04.
      - name: Bibliotecas de sistema do OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0t64 \
            || sudo apt-get install -y libgl1 libglib2.0-0

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install --no-compile -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

      # Os testes cobrem só lógica pura: não precisam de câmera nem do modelo.
      - name: Pytest
        run: pytest
